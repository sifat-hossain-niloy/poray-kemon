# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy for Poray Kemon in production.
#
# What this config does:
#   - HTTP → HTTPS redirect
#   - TLS termination (certs are issued / renewed by Certbot — see runbook)
#   - Strong security headers (HSTS, CSP, etc)
#   - Per-IP rate limiting on /api/* (blunt anti-abuse)
#   - Gzip + brotli on text responses
#   - Proxy to the Next.js container on the internal Docker network
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    # NOTE: $remote_addr is intentionally NOT recorded into our DB anywhere
    # (SRS NFR-PRIV-01). It only lives in this access log for short-term
    # operational debugging — make sure the log retention is short on disk.
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;       # don't leak nginx version
    client_max_body_size 1m; # 1MB — reviews + reports never need more

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Rate-limit zones ─────────────────────────────────────────────────────
    # 10 req/s per IP for API, with a 20-req burst window. The hashed-IP keys
    # are in-memory and DO NOT get written to disk anywhere.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    # Tighter ceiling for write endpoints
    limit_req_zone $binary_remote_addr zone=write_zone:10m rate=2r/s;

    # ── Upstream — the Next.js container ─────────────────────────────────────
    upstream nextjs {
        server nextjs:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME (Certbot) challenge route — keep accessible over plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS site ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name poraykemon.com www.poraykemon.com;

        # Certbot-managed certs (mounted from the host)
        ssl_certificate     /etc/letsencrypt/live/poraykemon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/poraykemon.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS — declare HTTPS-only for 6 months. Includes subdomains.
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # ── Write endpoints — strict rate limit ─────────────────────────────
        location ~ ^/api/(reviews|reports|admin/login|locale)$ {
            limit_req zone=write_zone burst=5 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ── Other API endpoints — relaxed rate limit ────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ── Static Next.js assets — long-cache, can be served direct ───────
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── App ─────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
