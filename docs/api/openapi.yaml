      tags: [Admin]
      summary: Add a university
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name_en, short_name, slug]
              properties:
                name_en:
                  type: string
                name_bn:
                  type: string
                short_name:
                  type: string
                slug:
                  type: string
                location_city:
                  type: string
                type:
                  type: string
                  enum: [public, private, international]
      responses:
        '201':
          description: University created

  /admin/departments/merge:
    post:
      tags: [Admin]
      summary: Merge duplicate departments under one canonical row
      description: |
        Collapses several "duplicate" department rows (e.g. "CSE", "C.S.E.",
        "Computer Science and Engineering") into one canonical target row.
        All affected rows must belong to the same university.

        In a single transaction:
          1. Every source's `professors.department_id` and `courses.department_id`
             is re-pointed to `target_id`.
          2. The target row is marked `status='verified'`.
          3. The source rows are deleted.

        Cross-university merges are rejected. `target_id` must NOT appear in
        `source_ids`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, source_ids]
              properties:
                target_id:
                  type: integer
                  description: The canonical row to keep. Marked verified after merge.
                source_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: integer
                  description: Rows to be repointed-then-deleted.
      responses:
        '200':
          description: Merge completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  target:
                    type: object
                    properties:
                      id: { type: integer }
                      nameEn: { type: string }
                  moved_professors: { type: integer }
                  moved_courses: { type: integer }
                  deleted_departments: { type: integer }
        '400':
          description: Validation failed (cross-university merge, target ∈ sources, etc.)
        '401':
          description: Admin authentication required
        '404':
          description: Target or one of the sources not found

  /admin/departments:
    post:
      tags: [Admin]
      summary: Add a department
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name_en, short_name, university_id]
              properties:
                name_en:
                  type: string
                name_bn:
                  type: string
                short_name:
                  type: string
                slug:
                  type: string
                university_id:
                  type: integer
      responses:
        '201':
          description: Department created
